# Render 后端部署配置（v2.0）
# 文档：https://render.com/docs/blueprint-spec
# 使用：连接 GitHub 仓库后，Render 会自动读取本文件创建服务

services:
  - type: web
    name: yibao-zhinao-api
    runtime: python
    region: singapore  # 新加坡节点，离国内最近
    plan: free  # 免费套餐够 Demo 用（550小时/月）；生产建议 starter
    branch: master
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python scripts/init_db.py
      python scripts/build_knowledge_base.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true  # push 到 master 自动部署
    envVars:
      # 数据库（开发用 SQLite，生产建议换 PostgreSQL）
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./yibao.db
      - key: PYTHON_VERSION
        value: "3.11.9"
      # 主力 LLM：商汤 SenseNova（在 Render 控制台填真实 Key）
      - key: LLM_API_KEY
        sync: false  # sync:false 表示在 Render 控制台手动填，不入仓库
      - key: LLM_BASE_URL
        value: https://token.sensenova.cn/v1
      - key: LLM_MODEL
        value: sensenova-6.7-flash-lite
      # 备选 LLM：阿里云 DashScope（故障自动切换）
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: DASHSCOPE_MODEL
        value: qwen-plus
      # OCR 服务：OCR.space
      - key: OCR_API_KEY
        sync: false
      - key: OCR_API_URL
        value: https://api.ocr.space/parse/image
      # 可选：API 鉴权（不填则开放，Demo 友好）
      - key: YIBAO_API_KEY
        sync: false
