[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=40

# 覆盖率口径说明：单元测试聚焦四大算法引擎 + EEG/影像引擎 + 设备适配层；
# routers/main/crud 等接入层由 scripts/smoke_test.py 端到端冒烟覆盖（68 项），
# 不计入单元覆盖率。基线 40% 为当前真实水平，防止引擎覆盖率回退。

[coverage:run]
source = app
omit =
    app/__pycache__/*
    app/services/llm_service.py
    app/services/ocr_service.py
    app/services/knowledge_base.py
    */tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
show_missing = true
precision = 2
