<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">

  <!-- ============ 背景 ============ -->
  <rect x="0" y="0" width="1200" height="820" fill="#F8FAFC"/>

  <!-- ============ 标题 ============ -->
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">EEG 设备接入整体架构</text>
  <text x="600" y="74" text-anchor="middle" font-size="13" fill="#64748B">医保智脑 v2.1.0 · 真实 EEG 设备接入完整方案</text>
  <line x1="480" y1="88" x2="720" y2="88" stroke="#1A56DB" stroke-width="3"/>

  <!-- ============ 层级标签（左侧） ============ -->
  <g font-size="11" font-weight="600" fill="#94A3B8">
    <rect x="40" y="170" width="60" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="70" y="185" text-anchor="middle" fill="#1A56DB">前端</text>
    <rect x="40" y="360" width="60" height="22" rx="11" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="70" y="375" text-anchor="middle" fill="#15803D">后端</text>
    <rect x="40" y="620" width="60" height="22" rx="11" fill="#FEF3C7" stroke="#FDE68A"/>
    <text x="70" y="635" text-anchor="middle" fill="#B45309">数据源</text>
  </g>

  <!-- ============ 第1层：前端 ============ -->
  <g>
    <rect x="160" y="140" width="1000" height="110" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <!-- 浏览器图标 -->
    <rect x="185" y="165" width="50" height="40" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <line x1="185" y1="178" x2="235" y2="178" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="192" cy="172" r="2" fill="#EF4444"/>
    <circle cx="200" cy="172" r="2" fill="#F59E0B"/>
    <circle cx="208" cy="172" r="2" fill="#22C55E"/>
    <text x="210" y="200" text-anchor="middle" font-size="9" fill="#64748B">Next.js</text>

    <text x="260" y="180" font-size="16" font-weight="700" fill="#1E3A8A">前端应用 · Next.js + React</text>
    <text x="260" y="202" font-size="12" fill="#475569">脑电健康页面 — 用户选择采集模式</text>

    <!-- 三种模式卡片 -->
    <g>
      <rect x="260" y="215" width="200" height="26" rx="13" fill="#FFFFFF" stroke="#93C5FD"/>
      <circle cx="278" cy="228" r="5" fill="#3B82F6"/>
      <text x="292" y="232" font-size="11" fill="#1E40AF">合成模拟</text>
      <text x="345" y="232" font-size="10" fill="#94A3B8">无需设备</text>
    </g>
    <g>
      <rect x="480" y="215" width="200" height="26" rx="13" fill="#FFFFFF" stroke="#22C55E"/>
      <circle cx="498" cy="228" r="5" fill="#22C55E"/>
      <text x="512" y="232" font-size="11" fill="#166534">真实设备采集</text>
      <text x="585" y="232" font-size="10" fill="#94A3B8">LSL 实时流</text>
    </g>
    <g>
      <rect x="700" y="215" width="200" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B"/>
      <circle cx="718" cy="228" r="5" fill="#F59E0B"/>
      <text x="732" y="232" font-size="11" fill="#92400E">文件导入</text>
      <text x="790" y="232" font-size="10" fill="#94A3B8">.edf / .csv</text>
    </g>
    <!-- 路演推荐标记 -->
    <g>
      <rect x="930" y="215" width="70" height="26" rx="13" fill="#FEF3C7" stroke="#F59E0B"/>
      <text x="965" y="232" text-anchor="middle" font-size="10" font-weight="600" fill="#B45309">⭐ 推荐</text>
    </g>
  </g>

  <!-- ============ 连接线：前端 → 后端 ============ -->
  <!-- 左侧：session -->
  <polyline points="380,250 380,300 500,300 500,340" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="500,340 495,332 505,332" fill="#3B82F6"/>
  <rect x="395" y="288" width="190" height="22" rx="11" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="490" y="303" text-anchor="middle" font-size="10" font-weight="600" fill="#1E40AF">POST /api/eeg/{uid}/session</text>

  <!-- 右侧：import -->
  <polyline points="800,250 800,300 680,300 680,340" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="680,340 675,332 685,332" fill="#F59E0B"/>
  <rect x="615" y="288" width="190" height="22" rx="11" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="710" y="303" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">POST /api/eeg/{uid}/import</text>

  <!-- ============ 第2层：后端（3个核心模块） ============ -->
  <g>
    <rect x="160" y="340" width="1000" height="240" rx="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
    <text x="180" y="365" font-size="16" font-weight="700" fill="#14532D">后端服务 · FastAPI</text>
    <text x="180" y="383" font-size="11" fill="#475569">设备适配层统一不同设备信号为 (signals, channels, sample_rate)，引擎逻辑完全复用</text>
  </g>

  <!-- 模块1：eeg.py Router -->
  <g>
    <rect x="190" y="400" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="190" y="400" width="280" height="32" rx="10" fill="#3B82F6"/>
    <rect x="190" y="420" width="280" height="12" fill="#3B82F6"/>
    <text x="330" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">eeg.py · Router 路由层</text>

    <!-- 图标：路由 -->
    <circle cx="215" cy="455" r="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="215" y="459" text-anchor="middle" font-size="10" fill="#1E40AF">→</text>

    <text x="235" y="459" font-size="11" fill="#1E293B">接收 EEG 信号请求</text>
    <text x="235" y="478" font-size="11" fill="#1E293B">调用分析引擎</text>
    <text x="235" y="497" font-size="11" fill="#1E293B">返回 EEGSession 结果</text>

    <rect x="210" y="515" width="240" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="220" y="529" font-size="10" fill="#64748B">端点：</text>
    <text x="220" y="542" font-size="9" fill="#1E40AF">/session · /session-device · /import · /latest</text>
  </g>

  <!-- 模块2：device_adapter.py -->
  <g>
    <rect x="500" y="400" width="280" height="160" rx="10" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
    <rect x="500" y="400" width="280" height="32" rx="10" fill="#22C55E"/>
    <rect x="500" y="420" width="280" height="12" fill="#22C55E"/>
    <text x="640" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">device_adapter.py · 设备适配层</text>

    <!-- 图标：适配器 -->
    <rect x="515" y="448" width="20" height="14" rx="3" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.5"/>
    <text x="525" y="459" text-anchor="middle" font-size="9" fill="#166534">⇄</text>

    <text x="545" y="459" font-size="11" fill="#1E293B">统一信号格式输出</text>

    <!-- 4种适配器小标签 -->
    <g font-size="9.5">
      <rect x="515" y="473" width="120" height="20" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
      <text x="575" y="486" text-anchor="middle" fill="#166534">Muse LSL</text>
      <rect x="645" y="473" width="120" height="20" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
      <text x="705" y="486" text-anchor="middle" fill="#166534">Emotiv CSV</text>
      <rect x="515" y="497" width="120" height="20" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
      <text x="575" y="510" text-anchor="middle" fill="#166534">OpenBCI LSL</text>
      <rect x="645" y="497" width="120" height="20" rx="4" fill="#F0FDF4" stroke="#86EFAC"/>
      <text x="705" y="510" text-anchor="middle" fill="#166534">CSV/EDF 解析</text>
    </g>

    <rect x="515" y="525" width="250" height="26" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="640" y="542" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">输出：(signals, channels, sample_rate)</text>
  </g>

  <!-- 模块3：engine.py -->
  <g>
    <rect x="810" y="400" width="320" height="160" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="810" y="400" width="320" height="32" rx="10" fill="#8B5CF6"/>
    <rect x="810" y="420" width="320" height="12" fill="#8B5CF6"/>
    <text x="970" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">engine.py · 分析引擎（核心）</text>

    <!-- 图标：引擎/齿轮 -->
    <circle cx="835" cy="455" r="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="835" y="459" text-anchor="middle" font-size="11" fill="#6D28D9">⚙</text>

    <text x="855" y="459" font-size="11" fill="#1E293B">频域分析 · 健康指标</text>

    <!-- 4个能力小标签 -->
    <g font-size="9.5">
      <rect x="825" y="473" width="140" height="20" rx="4" fill="#FAF5FF" stroke="#C4B5FD"/>
      <text x="895" y="486" text-anchor="middle" fill="#6D28D9">Welch PSD 频域分析</text>
      <rect x="975" y="473" width="140" height="20" rx="4" fill="#FAF5FF" stroke="#C4B5FD"/>
      <text x="1045" y="486" text-anchor="middle" fill="#6D28D9">8维健康指标计算</text>
      <rect x="825" y="497" width="140" height="20" rx="4" fill="#FAF5FF" stroke="#C4B5FD"/>
      <text x="895" y="510" text-anchor="middle" fill="#6D28D9">异常预警（8条规则）</text>
      <rect x="975" y="497" width="140" height="20" rx="4" fill="#FAF5FF" stroke="#C4B5FD"/>
      <text x="1045" y="510" text-anchor="middle" fill="#6D28D9">医保政策联动</text>
    </g>

    <rect x="825" y="525" width="290" height="26" rx="6" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="970" y="542" text-anchor="middle" font-size="10" font-weight="600" fill="#6D28D9">⭐ 引擎逻辑完全复用，无需修改</text>
  </g>

  <!-- 模块间连接箭头 -->
  <polyline points="470,480 500,480" fill="none" stroke="#64748B" stroke-width="2"/>
  <polygon points="500,480 492,476 492,484" fill="#64748B"/>
  <polyline points="780,480 810,480" fill="none" stroke="#64748B" stroke-width="2"/>
  <polygon points="810,480 802,476 802,484" fill="#64748B"/>

  <!-- ============ 连接线：后端 → 数据源 ============ -->
  <!-- 左：LSL/BLE -->
  <polyline points="640,560 640,590 380,590 380,620" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="380,620 375,612 385,612" fill="#22C55E"/>
  <rect x="430" y="578" width="170" height="22" rx="11" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="515" y="593" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">LSL Stream / BLE 蓝牙</text>

  <!-- 右：文件上传 -->
  <polyline points="970,560 970,590 820,590 820,620" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="820,620 815,612 825,612" fill="#F59E0B"/>
  <rect x="860" y="578" width="150" height="22" rx="11" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="935" y="593" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">文件上传 HTTP</text>

  <!-- ============ 第3层：数据源 ============ -->
  <!-- 左：实时设备 -->
  <g>
    <rect x="160" y="620" width="440" height="150" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="180" y="648" font-size="14" font-weight="700" fill="#92400E">EEG 设备（实时采集）</text>

    <!-- Muse 设备卡片 -->
    <g>
      <rect x="185" y="662" width="125" height="90" rx="8" fill="#FFFFFF" stroke="#F59E0B"/>
      <rect x="185" y="662" width="125" height="20" rx="8" fill="#F59E0B"/>
      <rect x="185" y="675" width="125" height="7" fill="#F59E0B"/>
      <text x="247" y="676" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Muse 2 / S ⭐</text>
      <text x="247" y="697" text-anchor="middle" font-size="9" fill="#92400E">4 通道 · 256Hz</text>
      <text x="247" y="711" text-anchor="middle" font-size="8" fill="#64748B">TP9/AF7/AF8/TP10</text>
      <text x="247" y="725" text-anchor="middle" font-size="8" fill="#64748B">蓝牙 · 干电极</text>
      <text x="247" y="741" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">原生适配</text>
    </g>

    <!-- Emotiv 设备卡片 -->
    <g>
      <rect x="325" y="662" width="125" height="90" rx="8" fill="#FFFFFF" stroke="#F59E0B"/>
      <rect x="325" y="662" width="125" height="20" rx="8" fill="#F59E0B"/>
      <rect x="325" y="675" width="125" height="7" fill="#F59E0B"/>
      <text x="387" y="676" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Emotiv EPOC X</text>
      <text x="387" y="697" text-anchor="middle" font-size="9" fill="#92400E">14 通道 · 256Hz</text>
      <text x="387" y="711" text-anchor="middle" font-size="8" fill="#64748B">蓝牙/2.4G · 湿电极</text>
      <text x="387" y="725" text-anchor="middle" font-size="8" fill="#64748B">Cortex API</text>
      <text x="387" y="741" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">自动映射</text>
    </g>

    <!-- OpenBCI 设备卡片 -->
    <g>
      <rect x="465" y="662" width="125" height="90" rx="8" fill="#FFFFFF" stroke="#F59E0B"/>
      <rect x="465" y="662" width="125" height="20" rx="8" fill="#F59E0B"/>
      <rect x="465" y="675" width="125" height="7" fill="#F59E0B"/>
      <text x="527" y="676" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">OpenBCI Cyton</text>
      <text x="527" y="697" text-anchor="middle" font-size="9" fill="#92400E">8 通道 · 250Hz</text>
      <text x="527" y="711" text-anchor="middle" font-size="8" fill="#64748B">蓝牙/USB · 可选</text>
      <text x="527" y="725" text-anchor="middle" font-size="8" fill="#64748B">GUI 内置 LSL</text>
      <text x="527" y="741" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">自动映射</text>
    </g>
  </g>

  <!-- 右：离线文件 -->
  <g>
    <rect x="620" y="620" width="440" height="150" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="640" y="648" font-size="14" font-weight="700" fill="#92400E">EEG 文件（离线导入）</text>

    <!-- CSV 文件卡片 -->
    <g>
      <rect x="645" y="662" width="130" height="90" rx="8" fill="#FFFFFF" stroke="#F59E0B"/>
      <rect x="645" y="662" width="130" height="20" rx="8" fill="#F59E0B"/>
      <rect x="645" y="675" width="130" height="7" fill="#F59E0B"/>
      <text x="710" y="676" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">.csv 通用格式</text>
      <text x="710" y="697" text-anchor="middle" font-size="9" fill="#92400E">第一行通道名</text>
      <text x="710" y="711" text-anchor="middle" font-size="8" fill="#64748B">后续每行采样点</text>
      <text x="710" y="725" text-anchor="middle" font-size="8" fill="#64748B">μV 电压值</text>
      <text x="710" y="741" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">最简单</text>
    </g>

    <!-- EDF 文件卡片 -->
    <g>
      <rect x="790" y="662" width="130" height="90" rx="8" fill="#FFFFFF" stroke="#F59E0B"/>
      <rect x="790" y="662" width="130" height="20" rx="8" fill="#F59E0B"/>
      <rect x="790" y="675" width="130" height="7" fill="#F59E0B"/>
      <text x="855" y="676" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">.edf 临床标准</text>
      <text x="855" y="697" text-anchor="middle" font-size="9" fill="#92400E">European Data Format</text>
      <text x="855" y="711" text-anchor="middle" font-size="8" fill="#64748B">医院 EEG 常用</text>
      <text x="855" y="725" text-anchor="middle" font-size="8" fill="#64748B">含元数据</text>
      <text x="855" y="741" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">临床兼容</text>
    </g>

    <!-- TXT 文件卡片 -->
    <g>
      <rect x="935" y="662" width="110" height="90" rx="8" fill="#FFFFFF" stroke="#F59E0B"/>
      <rect x="935" y="662" width="110" height="20" rx="8" fill="#F59E0B"/>
      <rect x="935" y="675" width="110" height="7" fill="#F59E0B"/>
      <text x="990" y="676" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">.txt 导出</text>
      <text x="990" y="697" text-anchor="middle" font-size="9" fill="#92400E">Muse/OpenBCI</text>
      <text x="990" y="711" text-anchor="middle" font-size="8" fill="#64748B">制表符/逗号</text>
      <text x="990" y="725" text-anchor="middle" font-size="8" fill="#64748B">分隔</text>
      <text x="990" y="741" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">设备导出</text>
    </g>
  </g>

  <!-- ============ 底部说明 ============ -->
  <rect x="160" y="788" width="1000" height="24" rx="12" fill="#1E293B"/>
  <text x="660" y="804" text-anchor="middle" font-size="11" fill="#E2E8F0">核心设计：设备适配层将不同设备信号统一为标准格式，分析引擎逻辑完全复用，无需为每种设备单独修改</text>

</svg>
