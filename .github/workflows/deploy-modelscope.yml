# ============================================================
# 自动部署 MedSignal Demo 到魔搭创空间（ModelScope Studio）
#
# 触发方式：
#   1. push 到 main 且涉及 后端/前端/部署文件 变更
#   2. 手动 workflow_dispatch（推荐首次部署用）
#
# 需要的仓库 Secrets：
#   MODELSCOPE_USERNAME  — 魔搭用户名（如手机号或自定义名）
#   MODELSCOPE_TOKEN     — 魔搭个人访问令牌（设置 → 访问令牌）
# 需要的仓库 Variables：
#   MODELSCOPE_SPACE_NAME— 创空间名（如 medsignal-demo）
#
# 原理：创空间本质是 Git 仓库，推送代码后魔搭平台自动 Docker 构建。
# ============================================================
name: Deploy to ModelScope

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/modelscope/**"
      - ".github/workflows/deploy-modelscope.yml"

jobs:
  deploy:
    name: Build & push demo to ModelScope Space
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble deploy package
        shell: bash
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STEP_API_KEY: ${{ secrets.STEP_API_KEY }}
          SENSENOVA_VISION_API_KEY: ${{ secrets.SENSENOVA_VISION_API_KEY }}
        run: |
          set -euo pipefail
          PKG=/tmp/mscope
          rm -rf "$PKG" && mkdir -p "$PKG"

          # 后端：剔除开发/本地产物与密钥文件（保留 scripts/：init_db.py 容器启动时初始化 DB）
          rsync -a \
            --exclude 'venv' --exclude '.venv' --exclude '__pycache__' \
            --exclude '*.db' --exclude '*.db-journal' \
            --exclude 'chroma_data' --exclude '.pytest_cache' \
            --exclude '*.pyc' --exclude 'tests' \
            --exclude '.env' --exclude '.env.*' \
            backend/ "$PKG/backend/"

          # 前端：剔除构建产物与密钥文件（pnpm-lock.yaml 必须保留：Dockerfile 用 frozen-lockfile）
          rsync -a \
            --exclude 'node_modules' --exclude '.next' --exclude '.pytest_cache' \
            --exclude '.env' --exclude '.env.*' \
            frontend/ "$PKG/frontend/"

          # 数据文件：init_db.py + claims/health/policy/eeg/imaging 引擎需要
          # 排除 receipts/（OCR 图片 10+MB，离线模式不用）和 .gitkeep
          rsync -a \
            --exclude 'receipts' --exclude '.gitkeep' \
            data/ "$PKG/data/"

          # 魔搭部署文件 → 包根目录
          cp deploy/modelscope/Dockerfile "$PKG/Dockerfile"
          cp deploy/modelscope/ms_deploy.json "$PKG/ms_deploy.json"
          cp deploy/modelscope/entrypoint.sh "$PKG/entrypoint.sh"
          cp deploy/modelscope/requirements-modelscope.txt "$PKG/requirements-modelscope.txt"
          cp README.md "$PKG/README.md"

          # 注入 LLM/Step/Vision Token：从 GitHub Secret 替换占位符，密钥永不进入 git 历史
          # bash 单引号包裹整个 python -c，python 内部全用双引号，避开 YAML/bash/python 三层引号嵌套
          python3 -c '
          import json, os, pathlib
          p = pathlib.Path("/tmp/mscope/ms_deploy.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          secrets_to_inject = [
              ("LLM_API_KEY", os.environ.get("LLM_API_KEY", "")),
              ("STEP_API_KEY", os.environ.get("STEP_API_KEY", "")),
              ("SENSENOVA_VISION_API_KEY", os.environ.get("SENSENOVA_VISION_API_KEY", "")),
          ]
          injected = []
          for key, val in secrets_to_inject:
              if val:
                  d["env"][key] = val
                  injected.append(key)
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")
          if injected:
              print("::notice::已从 GitHub Secret 注入:", ", ".join(injected))
          else:
              print("::warning::未配置任何 LLM/Step/Vision Secret，部署包保留占位符；请在魔搭创空间页面手工设置环境变量后才能调用真实 AI")
          '

          echo "--- 部署包内容 ---"
          find "$PKG" -maxdepth 2 -type f | sort | head -40

      - name: Push to ModelScope Space
        shell: bash
        env:
          MSCORE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          SPACE_OWNER: ${{ secrets.MODELSCOPE_USERNAME }}
          SPACE_NAME: ${{ vars.MODELSCOPE_SPACE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${MSCORE_TOKEN:-}" ] || [ -z "${SPACE_OWNER:-}" ] || [ -z "${SPACE_NAME:-}" ]; then
            echo "::error::缺少配置：请设置 secrets.MODELSCOPE_USERNAME / MODELSCOPE_TOKEN 和 variables.MODELSCOPE_SPACE_NAME"
            exit 1
          fi
          cd /tmp/mscope
          git init -q
          git config user.name "medsignal-deploy-bot"
          git config user.email "medsignal-deploy-bot@users.noreply.github.com"
          git add -A
          git -c i18n.commitEncoding=UTF-8 commit -q -m "deploy: MedSignal demo @ $(date -u +%Y-%m-%dT%H:%M:%SZ) (${GITHUB_SHA::8})" || {
            echo "::notice::没有内容变更，跳过推送"
            exit 0
          }
          # 魔搭创空间 git push 认证格式：username 必须为 oauth2（不是用户名），token 作为 password
          # 参考：https://modelscope.cn/skills/modelscope/modelscope-studio
          git remote add origin "https://oauth2:${MSCORE_TOKEN}@www.modelscope.cn/studios/${SPACE_OWNER}/${SPACE_NAME}.git"
          # 魔搭创空间默认分支为 master，且禁止 force push：
          # 若远程已有初始化文件（README/.gitattributes），先合并再推送，避免 [rejected]
          git fetch origin master -q 2>/dev/null || true
          if git rev-parse --verify origin/master >/dev/null 2>&1; then
            git merge origin/master --allow-unrelated-histories -X ours --no-edit -q
          fi
          git push origin HEAD:master 2>&1 | sed "s/${MSCORE_TOKEN}/***/g"
          echo "::notice::已推送至 https://www.modelscope.cn/studios/${SPACE_OWNER}/${SPACE_NAME}"
